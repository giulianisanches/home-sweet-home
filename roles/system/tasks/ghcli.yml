---
- name: Add GitHub CLI repository using deb822 format
  ansible.builtin.deb822_repository:
    name: ghcli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    state: present

- name: Install GH Cli package
  ansible.builtin.apt:
    name: gh
    state: latest
